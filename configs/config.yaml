# ==============================================================================
# Configuration for Indian Urban Traffic Flow Prediction Research Project
# MSc Informatics Thesis
# ==============================================================================

project:
  name: "indian-urban-traffic-flow-prediction"
  version: "1.0.0"
  random_seed: 42
  timezone: "Asia/Kolkata"

# Data Path Configuration
data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  external_dir: "data/external"
  raw_filename: "delhi_traffic_density_raw.csv"
  processed_filename: "delhi_traffic_15min_features.parquet"
  adjacency_matrix_filename: "sensor_graph_adjacency.npy"

# Schema & Parsing
schema:
  timestamp_col: "timestamp"
  target_col: "vehicle_count"
  sensor_id_col: "junction_id"
  latitude_col: "latitude"
  longitude_col: "longitude"
  speed_col: "average_speed_kmph"
  datetime_format: "%Y-%m-%d %H:%M:%S"

# Sampling and Forecasting Horizons
sampling:
  resample_interval: "15min"  # 15-minute standard temporal aggregation (equivalent to "15T")
  aggregation_func: "sum"     # Volume aggregated via sum, speeds via mean
  horizon_steps: [1, 2, 3, 4] # Forecast horizons: 15m (+1), 30m (+2), 45m (+3), 60m (+4)
  frequency_per_day: 96       # 96 steps per 24 hours at 15-minute intervals

# Chronological Train/Val/Test Split (Preserves temporal causality without leakage)
splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  purge_gap_steps: 4          # Gap between splits equal to max horizon to prevent overlap leakage

# Feature Engineering Pipeline Settings
features:
  cyclical:
    encode_time_of_day: true
    encode_day_of_week: true
    encode_month: true
  autoregressive_lags: [1, 2, 3, 4, 8, 96, 192]  # Lags: 15m, 30m, 45m, 60m, 2h, 24h, 48h
  rolling_windows:
    windows: [4, 12, 96]       # Rolling statistics over 1 hr, 3 hrs, 24 hrs
    metrics: ["mean", "std", "min", "max"]
  exogenous:
    include_indian_holidays: true
    include_delhi_odd_even_rule: true
    include_peak_hour_flags: true
    peak_hours_morning: [8, 11]
    peak_hours_evening: [17, 21]

# Evaluation Configuration
evaluation:
  metrics: ["mae", "rmse", "wmape", "smape"]
  primary_metric: "mae"
  save_predictions: true
  reports_dir: "reports"
  figures_dir: "reports/figures"

# Benchmark Model Configurations
models:
  baseline:
    naive_lag: 1
    seasonal_naive_lag: 96
    moving_average_window: 4
    ridge_alpha: 1.0

  tabular:
    random_forest:
      n_estimators: 200
      max_depth: 16
      min_samples_split: 5
      n_jobs: -1
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      early_stopping_rounds: 30

  sequential:
    sarima:
      order: [1, 1, 1]
      seasonal_order: [1, 1, 0, 96]
    prophet:
      daily_seasonality: true
      weekly_seasonality: true
      yearly_seasonality: false
    lstm:
      input_seq_len: 24        # 6 hours of historical steps
      hidden_dim: 128
      num_layers: 2
      dropout: 0.2
      batch_size: 64
      epochs: 50
      learning_rate: 0.001
    gru:
      input_seq_len: 24
      hidden_dim: 128
      num_layers: 2
      dropout: 0.2
      batch_size: 64
      epochs: 50
      learning_rate: 0.001

  spatiotemporal:
    stgcn:
      num_nodes: 32            # Default sensor graph nodes
      in_channels: 1
      time_history: 12         # 3 hours input history (12 x 15m)
      time_prediction: 4       # Multi-step output (1, 2, 3, 4 steps)
      graph_conv_type: "cheb"
      cheb_k: 3
      dropout: 0.3
      learning_rate: 0.002
      weight_decay: 0.0001
      epochs: 100
      batch_size: 32

